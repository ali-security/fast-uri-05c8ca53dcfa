name: Seal Build

# Upstream has no workflow that builds the npm release tarball, so this one
# adds the packaging leg while running the project's real test suite
# (npm run test:unit -> tape, npm run test:typescript -> tsd) on every OS the
# package must support.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'windows-latest', 'macos-latest']
        node-version: ['16', '18', '20', '22', '23', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true

      - name: Install
        run: npm install --ignore-scripts

      - name: Run tests
        run: npm test

  test-browser:
    name: Test browser ${{ matrix.browser }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'windows-latest', 'macos-latest']
        browser: ['chromium', 'firefox', 'webkit']
        exclude:
          - os: ubuntu-latest
            browser: webkit
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          check-latest: true

      - name: Install
        run: npm install --ignore-scripts

      - if: ${{ matrix.os == 'windows-latest' }}
        run: npx playwright install winldd

      - name: Run browser tests
        run: npm run test:browser:${{ matrix.browser }}

  test-regression-check-node10:
    name: Test compatibility with Node.js 10
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '10'
          check-latest: true

      - name: Install
        run: |
          npm install --ignore-scripts

      - name: Copy project as fast-uri to node_modules
        run: |
          rm -rf ./node_modules/fast-uri/lib &&
          rm -rf ./node_modules/fast-uri/index.js &&
          cp -r ./lib ./node_modules/fast-uri/lib &&
          cp ./index.js ./node_modules/fast-uri/index.js

      - name: Run tests
        run: |
          npm run test:unit
        env:
          NODE_OPTIONS: no-network-family-autoselection

  pack:
    name: Pack npm tarball
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - test
      - test-browser
      - test-regression-check-node10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '23'
          check-latest: true

      # The published tarball ships .github/, so restore those files to their
      # pristine upstream content and remove everything this build added
      # before packing. Otherwise the tarball would not match the registry.
      - name: Restore pristine repository contents
        run: |
          cp seal-pristine/stale.yml.txt .github/.stale.yml
          cp seal-pristine/dependabot.yml.txt .github/dependabot.yml
          cp seal-pristine/tests_checker.yml.txt .github/tests_checker.yml
          cp seal-pristine/ci.yml.txt .github/workflows/ci.yml
          cp seal-pristine/package-manager-ci.yml.txt .github/workflows/package-manager-ci.yml
          rm -f .github/workflows/seal-build.yml
          rm -rf seal-pristine

      - name: Pack
        run: npm pack --ignore-scripts

      - name: Show tarball contents
        run: tar tzf fast-uri-3.1.0.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: fast-uri-3.1.0.tgz
          if-no-files-found: error
